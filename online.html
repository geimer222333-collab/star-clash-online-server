<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101c2b">
<title>STAR CLASH ONLINE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1422;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#152c3a}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1324eF,#17364deF);padding:18px}
.card{width:min(440px,100%);border:1px solid #5c8ea6;border-radius:22px;padding:24px;background:#102438f2;box-shadow:0 15px 60px #0008;text-align:center}
h1{font-size:clamp(32px,8vw,52px);line-height:1;margin:5px 0 12px;color:#ffd84d;text-shadow:3px 4px #8b3b35;letter-spacing:1px}
p{color:#c7d9e5}input,select,button{font:inherit;border-radius:12px;border:1px solid #51758a;padding:12px;width:100%;margin-top:10px;background:#172f43;color:white}
button{font-weight:800;background:#f7bd3e;border:0;color:#2a2030;cursor:pointer}button:disabled{opacity:.5}
#status{min-height:26px;font-size:14px;color:#bfeaff;margin-top:12px}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:1px 2px #000;font-weight:800}
.pill{background:#071522c9;border:1px solid #567887;border-radius:12px;padding:8px 12px}
#controls{position:fixed;bottom:18px;left:0;right:0;display:none;align-items:end;justify-content:space-between;padding:0 18px;pointer-events:none}
#joy{width:112px;height:112px;border-radius:50%;background:#d9f5ff25;border:2px solid #d9f5ff80;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#d9f5ffb8;left:31px;top:31px}
.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}
.action{width:72px;height:72px;border-radius:50%;border:2px solid #fff8;background:#f36d5c;color:#fff;font-weight:900;box-shadow:0 4px #8e3d42}
#super{background:#5b80ff;width:62px;height:62px}
#hint{position:fixed;top:54px;left:10px;right:10px;text-align:center;font-size:12px;color:#e8f7ff;pointer-events:none}
@media(orientation:portrait){#hint:after{content:" • Для удобства поверни телефон горизонтально"}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" class="panel"><div class="card">
<h1>STAR CLASH</h1><p>Онлайн-арена · прототип</p>
<input id="name" maxlength="16" placeholder="Имя игрока" value="Игрок">
<select id="hero"><option value="0">Герой: Искра</option><option value="1">Герой: Тень</option><option value="2">Герой: Бум</option></select>
<button id="play">НАЙТИ ИГРОКА</button><button id="cancel" style="display:none;background:#6d8294">ОТМЕНА ПОИСКА</button>
<div id="status">Подключение к серверу…</div>
<p style="font-size:12px">Нужны два игрока, чтобы начать онлайн-матч.</p>
</div></div>
<div id="hud"><div class="pill" id="me">Ты: 100 HP</div><div class="pill" id="enemy">Соперник: ожидание</div></div>
<div id="hint"></div>
<div id="controls"><div id="joy"><div id="knob"></div></div><div class="actions"><button id="super" class="action">СУПЕР</button><button id="shoot" class="action">ОГОНЬ</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const menu=document.getElementById('menu'),status=document.getElementById('status'),play=document.getElementById('play'),cancel=document.getElementById('cancel');
const hud=document.getElementById('hud'),controls=document.getElementById('controls'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
const meText=document.getElementById('me'),enemyText=document.getElementById('enemy');
let socket=null,connected=false,queued=false,inMatch=false,myId=null,roomId=null,me=null,enemy=null,shots=[],keys={x:0,z:0},joyActive=false,joyCenter={x:0,y:0},lastMove=0,lastShot=0,hero=0,gameOver=false;
const colors=['#47d9c8','#b18aff','#ff9a47'];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function setStatus(t){status.textContent=t}
function connect(){if(socket)return;socket=io({transports:['websocket','polling']});socket.on('connect',()=>{connected=true;setStatus('Сервер подключён. Можно искать соперника.')});socket.on('connect_error',()=>setStatus('Не удалось подключиться. Обнови страницу через минуту.'));socket.on('disconnect',()=>{connected=false;inMatch=false;queued=false;showMenu('Соединение потеряно. Нажми поиск ещё раз.')});
socket.on('queue:waiting',d=>{queued=true;play.style.display='none';cancel.style.display='block';setStatus('Ищем соперника… в очереди: '+d.position)});
socket.on('queue:cancelled',()=>{queued=false;play.style.display='block';cancel.style.display='none';setStatus('Поиск отменён.')});
socket.on('queue:error',d=>setStatus(d.message||'Ошибка очереди'));
socket.on('match:found',d=>{roomId=d.roomId;myId=socket.id;me=d.players.find(p=>p.id===myId)||d.players[0];enemy=d.players.find(p=>p.id!==myId)||d.players[1];inMatch=true;queued=false;gameOver=false;shots=[];menu.style.display='none';hud.style.display='flex';controls.style.display='flex';play.style.display='block';cancel.style.display='none';document.getElementById('hint').textContent='Двигайся джойстиком и нажимай ОГОНЬ';refreshHud()});
socket.on('player:moved',p=>{if(enemy&&p.id===enemy.id)Object.assign(enemy,p)});
socket.on('player:shot',s=>{shots.push({x:s.x,z:s.z,vx:s.vx,vz:s.vz,owner:s.id,life:45})});
socket.on('player:health',d=>{if(me&&d.id===me.id)me.hp=d.hp;if(enemy&&d.id===enemy.id)enemy.hp=d.hp;refreshHud()});
socket.on('match:ended',d=>{gameOver=true;setStatus(d.winnerId===myId?'ПОБЕДА!':'ПОРАЖЕНИЕ');setTimeout(()=>showMenu(d.winnerId===myId?'Победа! Нажми поиск, чтобы сыграть снова.':'Ты проиграл. Попробуй ещё раз.'),1800)});
socket.on('match:opponent-left',()=>showMenu('Соперник отключился. Нажми поиск, чтобы сыграть снова.'));
}
function showMenu(t){menu.style.display='flex';hud.style.display='none';controls.style.display='none';inMatch=false;queued=false;play.style.display='block';cancel.style.display='none';document.getElementById('hint').textContent='';if(t)setStatus(t)}
play.onclick=()=>{connect();if(!connected){setStatus('Подключаемся к серверу… попробуй ещё раз через пару секунд.');return}hero=Number(document.getElementById('hero').value)||0;socket.emit('queue:join',{name:document.getElementById('name').value,hero});setStatus('Отправляем запрос…')};
cancel.onclick=()=>{if(socket)socket.emit('queue:cancel');play.style.display='block';cancel.style.display='none'};
function refreshHud(){if(me)meText.textContent=(me.name||'Ты')+': '+me.hp+' HP';if(enemy)enemyText.textContent=(enemy.name||'Соперник')+': '+enemy.hp+' HP'}
function toScreen(p){return {x:innerWidth/2+(p.x/20)*(innerWidth*.42),y:innerHeight/2+(p.z/11)*(innerHeight*.37)}}
function drawArena(){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#183745';ctx.fillRect(0,0,w,h);ctx.fillStyle='#244b4b';ctx.fillRect(w*.06,h*.09,w*.88,h*.82);
ctx.strokeStyle='#376a63';ctx.lineWidth=1;for(let x=w*.06;x<w*.94;x+=42){ctx.beginPath();ctx.moveTo(x,h*.09);ctx.lineTo(x,h*.91);ctx.stroke()}for(let y=h*.09;y<h*.91;y+=42){ctx.beginPath();ctx.moveTo(w*.06,y);ctx.lineTo(w*.94,y);ctx.stroke()}
for(let i=0;i<9;i++){let x=(i*137+80)%Math.max(1,w),y=(i*91+120)%Math.max(1,h);ctx.fillStyle='#6e8a4a';ctx.fillRect(x,y,22,18);ctx.fillStyle='#8eac5c';ctx.fillRect(x+3,y+3,16,12)}
}
function drawPlayer(p,isMe){if(!p)return;const s=toScreen(p);ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,15,22,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[p.hero||0];ctx.beginPath();ctx.arc(0,0,21,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=isMe?'#fff':'#ff6c70';ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-5,4,0,Math.PI*2);ctx.arc(7,-5,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172536';ctx.fillRect(-10,6,20,4);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.name||'Игрок',0,-30);ctx.restore()}
function draw(){drawArena();if(inMatch){drawPlayer(me,true);drawPlayer(enemy,false);for(const s of shots){const q=toScreen(s);ctx.fillStyle=s.owner===myId?'#ffe56b':'#ff6b6b';ctx.beginPath();ctx.arc(q.x,q.y,7,0,Math.PI*2);ctx.fill()}}else{ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.arc(innerWidth/2,innerHeight/2,75,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('STAR CLASH',innerWidth/2,innerHeight/2+6)}requestAnimationFrame(draw)}
function move(){if(!inMatch||!me||gameOver)return;const now=Date.now();if(Math.abs(keys.x)+Math.abs(keys.z)>.05&&now-lastMove>45){me.x=Math.max(-17,Math.min(17,me.x+keys.x*.55));me.z=Math.max(-9,Math.min(9,me.z+keys.z*.55));socket.emit('player:move',{x:me.x,z:me.z,hero});lastMove=now}}
function shoot(){if(!inMatch||!me||!enemy||gameOver)return;const now=Date.now();if(now-lastShot<350)return;lastShot=now;const dx=enemy.x-me.x,dz=enemy.z-me.z,len=Math.hypot(dx,dz)||1,vx=dx/len*1.3,vz=dz/len*1.3;socket.emit('player:shot',{x:me.x,z:me.z,vx,z:vz});shots.push({x:me.x,z:me.z,vx,vz,owner:myId,life:40});if(Math.hypot(dx,dz)<8)socket.emit('player:damage',{targetId:enemy.id,amount:10});}
setInterval(()=>{move();for(const s of shots){s.x+=s.vx;s.z+=s.vz;s.life--;if(inMatch&&s.owner===myId&&enemy&&Math.hypot(s.x-enemy.x,s.z-enemy.z)<1.6){s.life=0;socket.emit('player:damage',{targetId:enemy.id,amount:10})}}shots=shots.filter(s=>s.life>0)},50);
joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);const r=joy.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};updateJoy(e)});
joy.addEventListener('pointermove',e=>{if(joyActive)updateJoy(e)});function updateJoy(e){const dx=e.clientX-joyCenter.x,dy=e.clientY-joyCenter.y,len=Math.hypot(dx,dy)||1,m=Math.min(34,len);knob.style.left=(31+dx/len*m)+'px';knob.style.top=(31+dy/len*m)+'px';keys.x=dx/len*(m/34);keys.z=dy/len*(m/34)}
function stopJoy(){joyActive=false;keys={x:0,z:0};knob.style.left='31px';knob.style.top='31px'}joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('super').addEventListener('pointerdown',e=>{e.preventDefault();shoot();shoot()});
connect();draw();
})();
</script>
</body>
</html>
