<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17294b"><title>Star Clash Arena</title>
<style>
:root{--gold:#ffdb4d;--ink:#15213b;--panel:#20385f;--cyan:#77efff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b32;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:none;user-select:none}button{font:inherit;touch-action:none;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 20%,#304e78,#111b32 72%)}header{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:linear-gradient(#243e68,#172947);border-bottom:3px solid #0b1427;box-shadow:0 3px 0 #496a93}#brand{font-weight:1000;letter-spacing:.6px;font-size:20px;text-shadow:0 2px #8d4a23}#brand span{color:var(--gold)}.headbtn{border:2px solid #5875a1;background:#2b456d;border-radius:10px;padding:7px 10px;color:#fff;font-size:12px;font-weight:900}#stage{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(#07142c88,#09162bbd)}#card{width:min(450px,100%);max-height:100%;overflow:auto;background:linear-gradient(150deg,#36588a,#1b2c4e 60%,#172540);border:3px solid #7d9bc8;border-radius:24px;padding:18px;box-shadow:0 8px 0 #0b1427,0 20px 50px #0008;text-align:center}#logo{font-size:clamp(28px,7vw,43px);font-weight:1000;line-height:1.03;letter-spacing:-1px;text-shadow:0 4px #9e5127,2px 5px #101a2d;margin:0}#logo span{color:#ffe45e}#tag{font-size:10px;letter-spacing:2px;color:#bcecff;font-weight:900;margin:8px 0 12px}.modebar{display:flex;gap:7px;margin:10px 0}.mode{flex:1;border:2px solid #5c77a0;background:#182b4a;color:#d5e5ff;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:900}.mode.on{border-color:#ffe15b;background:#4c4b45;color:#fff3ad}.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.fighter{border:2px solid #4d6b95;border-radius:14px;background:linear-gradient(#233e66,#152643);color:#fff;padding:8px 4px 10px;min-width:0;box-shadow:0 4px #101a2d}.fighter.sel{border-color:#ffe25c;box-shadow:0 4px #a16c26,0 0 0 2px #ffef8b55;transform:translateY(-2px)}.portrait{width:65px;height:65px;margin:0 auto 6px;border-radius:22px;border:3px solid #ffffff7a;display:grid;place-items:center;font-size:35px;text-shadow:0 3px #0004;box-shadow:inset 0 -7px #0002,0 3px #0c1730}.fighter b{font-size:12px;letter-spacing:.5px}.fighter small{display:block;font-size:9px;color:#bed3f5;margin-top:3px;line-height:1.3}.yellow{background:linear-gradient(145deg,#fff07b,#ffae27)}.red{background:linear-gradient(145deg,#ffb08b,#e64765)}.blue{background:linear-gradient(145deg,#b8faff,#3e9fff)}.green{background:linear-gradient(145deg,#b5ff8b,#30bd81)}.cta{width:100%;border:0;border-radius:13px;padding:14px 10px;background:linear-gradient(#ffec7d,#ffc12f);color:#53320a;font-weight:1000;font-size:16px;box-shadow:0 5px #a35b20,0 9px 20px #ffbf3530}.hint{font-size:10px;color:#b9cceb;line-height:1.45;margin:12px 0 0}.hidden{display:none!important}#hud{position:absolute;top:9px;left:9px;right:9px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px #000;font-size:12px;font-weight:1000}#hpbox,#scorebox{background:#14233ddf;border:2px solid #ffffff4d;border-radius:11px;padding:7px 9px;min-width:112px}#hpbar{height:9px;background:#3a4c65;border-radius:8px;margin-top:4px;overflow:hidden}#hpfill{height:100%;width:100%;background:linear-gradient(#8dff71,#32c75b);border-radius:8px}#scorebox{text-align:right}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:116px;height:116px;border-radius:50%;border:3px solid #ffffff70;background:#10203a9c;position:relative;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 0 7px #ffffff0c}#nub{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:linear-gradient(#f7fbff,#b4cce9);border:3px solid #fff;box-shadow:0 4px 8px #0006}#actions{display:flex;align-items:end;gap:10px;pointer-events:auto}#attack,#super{border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:1000;text-shadow:0 2px #0007;border:3px solid #ffffffb0;box-shadow:0 5px #172039, inset 0 -5px #0002}#attack{width:78px;height:78px;background:radial-gradient(#ffac62,#e0444e)}#super{width:61px;height:61px;background:radial-gradient(#fff07a,#f2a722);color:#54320b;margin-bottom:3px;opacity:.62}#super.ready{opacity:1;box-shadow:0 5px #8b541d,0 0 20px #ffe75b}#tip{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:#ffffffa6;pointer-events:none}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#14233ddd;border:2px solid #ffffff55;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:900;display:none;white-space:nowrap;pointer-events:none}#result{position:absolute;inset:0;background:#0c1736bb;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}#resultbox{background:#29456f;border:3px solid #ffe45b;border-radius:22px;padding:22px;max-width:340px;width:100%;box-shadow:0 8px #10192a}#result h2{font-size:30px;margin:0 0 8px;text-shadow:0 3px #9c4a22}#result p{font-size:13px;color:#d4e2fb}#result button{margin-top:8px}@media(min-width:700px){#stage{width:min(100%,1100px);margin:auto}#controls{max-width:950px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}}@media(max-height:600px){header{height:43px}#card{padding:10px 14px}.portrait{width:48px;height:48px;font-size:27px;border-radius:16px}.fighter{padding:5px 3px}.hint{margin-top:6px}.roster{margin:7px 0}.cta{padding:10px}}
</style></head><body><div id="app"><header><div id="brand">⭐ STAR <span>CLASH</span></div><button class="headbtn" id="sound">🔊 ЗВУК</button></header><main id="stage"><canvas id="game"></canvas>
<div id="hud" class="hidden"><div id="hpbox">❤️ <span id="hptext">100</span><div id="hpbar"><div id="hpfill"></div></div></div><div id="scorebox">⭐ <span id="score">0</span><br><small id="alive">БОТЫ: 5</small></div></div>
<div id="toast"></div><div id="menu"><div id="card"><h1 id="logo">STAR <span>CLASH!</span></h1><div id="tag">АРЕНА · БЫСТРЫЕ БИТВЫ</div><div class="modebar"><button class="mode on" id="classic">⚔ БОЙ С БОТАМИ</button><button class="mode" id="local">📱 ОДИН ТЕЛЕФОН</button></div><div class="roster"><button class="fighter sel" data-f="spark"><div class="portrait yellow">⚡</div><b>ИСКРА</b><small>100 HP<br>Сбалансированный</small></button><button class="fighter" data-f="tank"><div class="portrait red">👊</div><b>ГРОМ</b><small>160 HP<br>Мощный удар</small></button><button class="fighter" data-f="nova"><div class="portrait blue">💫</div><b>НОВА</b><small>85 HP<br>Очень быстрая</small></button></div><button class="cta" id="play">▶ НАЧАТЬ БОЙ</button><p class="hint">Новая фанатская мини-игра с мультяшной графикой, эффектами и звуком. Управление: джойстик слева, атака и суперспособность справа.</p></div></div>
<div id="controls" class="hidden"><div id="stick"><div id="nub"></div></div><div id="actions"><button id="super">⚡<br>СУПЕР</button><button id="attack">🔥<br>АТАКА</button></div></div><div id="result"><div id="resultbox"><h2 id="resulttitle">ПОБЕДА!</h2><p id="resulttext"></p><button class="cta" id="replay">↻ ЕЩЁ РАЗ</button><button class="headbtn" id="lobbybtn" style="margin-top:9px;width:100%">В МЕНЮ</button></div></div><div id="tip" class="hidden">Двигай джойстик · жми АТАКА · СУПЕР заряжается от попаданий</div></main></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#game'),ctx=c.getContext('2d');let W=900,H=600,dpr=1,selected='spark',active=false,player=null,bots=[],shots=[],particles=[],score=0,charge=0,last=0,sound=true,ac=null,joy={x:0,y:0},keys={},fireHeld=false,botMode=5,shake=0;
const F={spark:{name:'Искра',hp:100,speed:3.35,damage:18,color:'#ffd044',emoji:'⚡'},tank:{name:'Гром',hp:160,speed:2.45,damage:27,color:'#ff6475',emoji:'👊'},nova:{name:'Нова',hp:85,speed:3.9,damage:14,color:'#65dfff',emoji:'💫'}};
const obstacles=[[265,205,70,50,'rock'],[550,220,80,52,'rock'],[100,440,74,45,'rock'],[740,430,78,50,'rock'],[100,115,100,47,'bush'],[360,80,110,50,'bush'],[660,120,125,55,'bush'],[235,365,105,52,'bush'],[520,470,120,55,'bush'],[760,290,85,45,'bush']];
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx.setTransform(c.width/W,0,0,c.height/H,0,0);draw()}window.addEventListener('resize',resize);
function beep(f=440,d=.08,type='sine',v=.04){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 ЗВУК':'🔇 БЕЗ ЗВУКА';if(sound)beep(700,.1)};
document.querySelectorAll('.fighter').forEach(b=>b.onclick=()=>{selected=b.dataset.f;document.querySelectorAll('.fighter').forEach(x=>x.classList.toggle('sel',x===b));beep(480,.045)});
$('#local').onclick=()=>toast('Один телефон: играешь против ботов. Для реального онлайна нужен сервер.');$('#classic').onclick=()=>toast('Бой с ботами выбран!');
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2300)}
function start(){let f=F[selected];player={x:W/2,y:H/2,hp:f.hp,max:f.hp,speed:f.speed,damage:f.damage,color:f.color,name:f.name,fire:0};bots=[];shots=[];particles=[];score=0;charge=0;shake=0;for(let i=0;i<botMode;i++){let x,y;do{x=40+Math.random()*(W-80);y=45+Math.random()*(H-90)}while(Math.hypot(x-player.x,y-player.y)<160);bots.push({x,y,hp:70,max:70,color:['#a98aff','#ff895f','#66dfa0','#ff75cb','#74b8ff'][i%5],speed:.85+Math.random()*.55,fire:50+Math.random()*100,phase:Math.random()*6})}active=true;$('#menu').classList.add('hidden');$('#result').style.display='none';$('#hud').classList.remove('hidden');$('#controls').classList.remove('hidden');$('#tip').classList.remove('hidden');beep(620,.12,'triangle');last=performance.now();requestAnimationFrame(loop)}
$('#play').onclick=start;$('#replay').onclick=start;$('#lobbybtn').onclick=()=>{active=false;$('#result').style.display='none';$('#menu').classList.remove('hidden');$('#hud').classList.add('hidden');$('#controls').classList.add('hidden');$('#tip').classList.add('hidden');$('#card').innerHTML='<h1 id="logo">STAR <span>CLASH!</span></h1><div id="tag">АРЕНА · БЫСТРЫЕ БИТВЫ</div><div class="roster"><button class="fighter sel" data-f="spark"><div class="portrait yellow">⚡</div><b>ИСКРА</b><small>100 HP</small></button><button class="fighter" data-f="tank"><div class="portrait red">👊</div><b>ГРОМ</b><small>160 HP</small></button><button class="fighter" data-f="nova"><div class="portrait blue">💫</div><b>НОВА</b><small>85 HP</small></button></div><button class="cta" id="play">▶ НАЧАТЬ БОЙ</button><p class="hint">Джойстик слева, атака справа. Супер заряжается от попаданий.</p>';document.querySelectorAll('.fighter').forEach(b=>b.onclick=()=>{selected=b.dataset.f;document.querySelectorAll('.fighter').forEach(x=>x.classList.toggle('sel',x===b))});$('#play').onclick=start};
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function shot(from,to,damage,color,hero){let dx=to.x-from.x,dy=to.y-from.y,d=Math.hypot(dx,dy)||1;shots.push({x:from.x,y:from.y,vx:dx/d*8.3,vy:dy/d*8.3,damage,color,hero,life:65});if(hero)beep(430,.045,'square',.025)}
function nearest(){return bots.filter(b=>b.hp>0).sort((a,b)=>dist(a,player)-dist(b,player))[0]}
function attack(){if(!active||player.fire>0)return;let target=nearest();if(target)shot(player,target,player.damage,player.color,true);else shot(player,{x:player.x+100,y:player.y},player.damage,player.color,true);player.fire=13}
$('#attack').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;attack()});$('#attack').addEventListener('pointerup',()=>fireHeld=false);$('#attack').addEventListener('pointercancel',()=>fireHeld=false);
$('#super').addEventListener('pointerdown',e=>{e.preventDefault();if(!active||charge<100){beep(170,.07);return}charge=0;$('#super').classList.remove('ready');shake=12;for(let i=0;i<12;i++){let a=i*Math.PI/6;shots.push({x:player.x,y:player.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,damage:player.damage*1.3,color:'#fff36b',hero:true,life:42})}for(let i=0;i<30;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:35,color:'#fff36b'});beep(880,.24,'sawtooth')});
const stick=$('#stick'),nub=$('#nub');function setJoy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=Math.min(37,d);joy={x:d?dx/d*m/37:0,y:d?dy/d*m/37:0};nub.style.left=(32+joy.x*33)+'px';nub.style.top=(32+joy.y*33)+'px'}function resetJoy(){joy={x:0,y:0};nub.style.left='32px';nub.style.top='32px'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)setJoy(e)});stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(now){if(!active)return;let dt=Math.min(2.2,(now-last)/16.67);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(player.fire>0)player.fire-=dt;let x=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.hypot(x,y)||1;player.x=Math.max(27,Math.min(W-27,player.x+x/m*player.speed*dt));player.y=Math.max(40,Math.min(H-27,player.y+y/m*player.speed*dt));if(fireHeld&&player.fire<=0)attack();
for(let b of bots){if(b.hp<=0)continue;let d=dist(b,player),dx=(player.x-b.x)/(d||1),dy=(player.y-b.y)/(d||1);b.phase+=.03*dt;if(d>155){b.x+=dx*b.speed*dt;b.y+=dy*b.speed*dt}else{b.x+=(-dy*.7+Math.sin(b.phase)*.25)*b.speed*dt;b.y+=(dx*.7+Math.cos(b.phase)*.25)*b.speed*dt}b.x=Math.max(24,Math.min(W-24,b.x));b.y=Math.max(35,Math.min(H-24,b.y));b.fire-=dt;if(d<370&&b.fire<=0){shot(b,player,8,b.color,false);b.fire=65+Math.random()*35}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let hit=false;if(s.hero){for(let b of bots)if(b.hp>0&&dist(s,b)<22){b.hp-=s.damage;charge=Math.min(100,charge+12);hit=true;for(let k=0;k<5;k++)particles.push({x:s.x,y:s.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:18,color:s.color});if(b.hp<=0){score++;beep(210,.13,'triangle')}break}}else if(dist(s,player)<24){player.hp-=s.damage;hit=true;shake=5;beep(95,.09,'sawtooth',.04);for(let k=0;k<7;k++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:22,color:'#ff5a6d'})}if(hit||s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H)shots.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
$('#hptext').textContent=Math.max(0,Math.ceil(player.hp));$('#hpfill').style.width=Math.max(0,player.hp/player.max*100)+'%';$('#score').textContent=score;$('#alive').textContent='БОТЫ: '+bots.filter(b=>b.hp>0).length;$('#super').classList.toggle('ready',charge>=100);if(player.hp<=0)end(false);else if(bots.every(b=>b.hp<=0))end(true)}
function end(win){active=false;$('#result').style.display='flex';$('#resulttitle').textContent=win?'ПОБЕДА!':'НОКАУТ!';$('#resulttext').textContent=(win?'Арена зачищена! ':'Бой окончен. ')+'Побеждено бойцов: '+score;beep(win?830:120,.28,'triangle')}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#82cc56';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=48)for(let x=0;x<W;x+=48)if((x/48+y/48)%2===0){ctx.fillStyle='#91da60';ctx.fillRect(x,y,24,24)}ctx.strokeStyle='#4e9342';ctx.lineWidth=17;ctx.strokeRect(8,8,W-16,H-16);
for(let [x,y,w,h,type] of obstacles){if(type==='rock'){ctx.fillStyle='#5e686d';rr(x,y+8,w,h,12);ctx.fillStyle='#a4b0b1';rr(x+3,y,w-6,h-8,12);ctx.fillStyle='#d9e0d8';rr(x+11,y+5,w*.42,7,4);ctx.fillStyle='#899697';rr(x+w*.63,y+18,10,6,3)}else{ctx.fillStyle='#367e3c';rr(x,y+8,w,h,16);ctx.fillStyle='#42a149';rr(x+3,y,w-6,h-7,16);for(let j=0;j<8;j++){ctx.fillStyle=j%2?'#70c75a':'#4bad4f';ctx.beginPath();ctx.arc(x+10+j*(w-20)/7,y+12+(j%3)*6,10,0,7);ctx.fill()}}}
ctx.strokeStyle='#fff4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H/2,47,0,7);ctx.stroke();
for(let s of shots){ctx.fillStyle='#0004';ctx.beginPath();ctx.arc(s.x+2,s.y+3,8,0,7);ctx.fill();ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3+Math.random()*2,0,7);ctx.fill();ctx.globalAlpha=1}
for(let b of bots)if(b.hp>0)char(b,false);if(player)char(player,true)}
function char(p,mine){ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(p.x,p.y+17,26,11,0,0,7);ctx.fill();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,23,0,7);ctx.fill();ctx.strokeStyle=mine?'#fff3a0':'#fff';ctx.lineWidth=3.5;ctx.stroke();ctx.fillStyle='#fff9d8';ctx.beginPath();ctx.arc(p.x-7,p.y-4,5,0,7);ctx.arc(p.x+7,p.y-4,5,0,7);ctx.fill();ctx.fillStyle='#26324b';ctx.beginPath();ctx.arc(p.x-6,p.y-4,2.2,0,7);ctx.arc(p.x+8,p.y-4,2.2,0,7);ctx.fill();ctx.strokeStyle='#26324b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y+5,5,.2,Math.PI-.2);ctx.stroke();ctx.fillStyle='#f8fbff';rr(p.x-26,p.y-37,52,7,4);ctx.fillStyle=p.hp>p.max*.35?'#47e36d':'#ff4057';rr(p.x-25,p.y-36,50*Math.max(0,p.hp/p.max),5,3);if(mine){ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#26324b';ctx.strokeText(p.name,p.x,p.y-46);ctx.fillStyle='#fff';ctx.fillText(p.name,p.x,p.y-46)}}
resize();
})();
</script></body></html>
